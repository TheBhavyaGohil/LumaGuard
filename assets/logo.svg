<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0E16"/>
      <stop offset="100%" stop-color="#131828"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="78%" cy="18%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="botGlow" cx="20%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldStroke" x1="110" y1="90" x2="402" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="140" y1="340" x2="365" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.24"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M256 108 L382 146 C382 268 338 358 256 402 C174 358 130 268 130 146 Z"/>
    </clipPath>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Obsidian Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#topGlow)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#botGlow)"/>
  <rect x="22" y="22" width="468" height="468" rx="110" stroke="#B4D2FF" stroke-opacity="0.18" stroke-width="4"/>

  <!-- Shield Body & Rim -->
  <path d="M256 90 L398 134 C398 272 348 372 256 422 C164 372 114 272 114 134 Z"
        fill="#12192A" fill-opacity="0.82" stroke="url(#shieldStroke)" stroke-width="18" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Interior Motif -->
  <g clip-path="url(#shieldClip)">
    <!-- 1:1 Unclamped Glare Reference -->
    <line x1="144" y1="344" x2="368" y2="140" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="8 8"/>

    <!-- Crescent / Attenuated Light Orb -->
    <circle cx="210" cy="192" r="24" fill="#E0F2FE" fill-opacity="0.92"/>
    <circle cx="222" cy="186" r="22" fill="#12192A"/>

    <!-- Soft-Knee Clamped Curve Fill -->
    <path d="M144 344 L260 238 Q296 206 368 198 L368 344 Z" fill="url(#areaFill)"/>

    <!-- Clamped Tone Curve -->
    <path d="M144 344 L260 238 Q296 206 368 198" stroke="#E0F7FF" stroke-width="15" stroke-linecap="round" fill="none" filter="url(#softGlow)"/>

    <!-- Knee Control Node -->
    <circle cx="262" cy="236" r="18" fill="#0E1422" stroke="#67E8F9" stroke-width="7"/>
  </g>
</svg>
