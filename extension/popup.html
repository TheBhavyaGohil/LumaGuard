<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LumaGuard</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell" id="appShell">
    <div class="ambient-glow"></div>

    <!-- Header -->
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="LumaGuard" class="brand-icon" />
        <div class="brand-text">
          <div class="brand-title-row">
            <h1>LumaGuard</h1>
            <span class="status-pill" id="statusPill">
              <span class="status-dot"></span>
              <span id="statusText">Active</span>
            </span>
          </div>
          <p class="subtitle">Highlight Luminance Normalizer</p>
        </div>
      </div>

      <label class="power-switch" title="Toggle LumaGuard (Alt+Shift+L)">
        <input type="checkbox" id="enabled" />
        <span class="switch-track">
          <span class="switch-thumb"></span>
        </span>
      </label>
    </header>

    <!-- Live Tone Curve Visualizer -->
    <section class="card curve-card">
      <div class="card-top">
        <span class="section-label">Transfer Curve</span>
        <div class="swatch-readout" title="Pure white (#FFFFFF) output after clamping">
          <span class="swatch before"></span>
          <span class="arrow">→</span>
          <span class="swatch after" id="afterSwatch"></span>
          <code id="hexOut">#B8B8B8</code>
        </div>
      </div>
      <div class="curve-wrap">
        <svg id="curveSvg" viewBox="0 0 288 76" preserveAspectRatio="none">
          <defs>
            <linearGradient id="curveGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#818CF8"/>
              <stop offset="55%" stop-color="#38BDF8"/>
              <stop offset="100%" stop-color="#67E8F9"/>
            </linearGradient>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
              <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.01"/>
            </linearGradient>
          </defs>
          <!-- Subtle Grid -->
          <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
            <line x1="72" y1="0" x2="72" y2="76"/>
            <line x1="144" y1="0" x2="144" y2="76"/>
            <line x1="216" y1="0" x2="216" y2="76"/>
            <line x1="0" y1="19" x2="288" y2="19"/>
            <line x1="0" y1="38" x2="288" y2="38"/>
            <line x1="0" y1="57" x2="288" y2="57"/>
          </g>
          <!-- 1:1 Linear Reference -->
          <line x1="4" y1="72" x2="284" y2="4" stroke="rgba(148,163,184,0.22)" stroke-width="1" stroke-dasharray="3 4"/>
          <!-- Ceiling Guide -->
          <line id="ceilingLine" x1="0" y1="22" x2="288" y2="22" stroke="rgba(103,232,249,0.25)" stroke-width="1" stroke-dasharray="2 3"/>
          <!-- Dynamic Fill & Curve -->
          <path id="curveArea" fill="url(#areaGrad)" d=""/>
          <path id="curvePath" fill="none" stroke="url(#curveGrad)" stroke-width="2.2" stroke-linecap="round" d=""/>
          <!-- Knee Marker -->
          <circle id="kneeDot" cx="160" cy="30" r="4" fill="#0B0E16" stroke="#67E8F9" stroke-width="2"/>
        </svg>
      </div>
    </section>

    <!-- Presets -->
    <section class="presets" role="group" aria-label="Quick Presets">
      <button class="preset-btn" data-preset="reading">Reading</button>
      <button class="preset-btn" data-preset="night">Deep Night</button>
      <button class="preset-btn" data-preset="diagram">Diagram Dark</button>
    </section>

    <!-- Precision Sliders -->
    <section class="card controls-card">
      <div class="control">
        <div class="control-head">
          <label for="ceiling">White Ceiling</label>
          <span class="value" id="ceilingVal">72%</span>
        </div>
        <input type="range" id="ceiling" min="0.45" max="0.95" step="0.01" value="0.72" />
      </div>

      <div class="control">
        <div class="control-head">
          <label for="threshold">Knee Threshold</label>
          <span class="value" id="thresholdVal">60%</span>
        </div>
        <input type="range" id="threshold" min="0.25" max="0.85" step="0.01" value="0.60" />
      </div>

      <div class="control">
        <div class="control-head">
          <label for="warmth">Paper Warmth</label>
          <span class="value" id="warmthVal">4%</span>
        </div>
        <input type="range" id="warmth" min="0.00" max="0.14" step="0.01" value="0.04" />
      </div>
    </section>

    <!-- Mode & Site Controls -->
    <section class="card toggles-card">
      <label class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-title">Smart Diagram Dark Mode</span>
          <span class="toggle-desc">Auto-invert white-canvas charts &amp; docs</span>
        </div>
        <div class="mini-switch">
          <input type="checkbox" id="smartInvert" />
          <span class="mini-track"><span class="mini-thumb"></span></span>
        </div>
      </label>

      <div class="divider"></div>

      <button class="site-btn" id="siteToggleBtn" type="button">
        <span class="site-left">
          <span class="site-dot" id="siteDot"></span>
          <span id="siteLabel">Current site</span>
        </span>
        <span class="site-action" id="siteAction">Pause</span>
      </button>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span class="shortcut"><kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>L</kbd></span>
      <button class="reset-btn" id="resetBtn" type="button">Reset Defaults</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
